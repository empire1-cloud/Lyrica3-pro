name: Artist Growth Engine Gate

on:
  push:
    branches:
      - codex/artist-growth-royalty-engine-v1
  pull_request:
    paths:
      - "backend/artist_growth_core.py"
      - "backend/artist_growth_engine.py"
      - "backend/artist_growth_api.py"
      - "backend/paid_growth_core.py"
      - "backend/paid_growth_connectors.py"
      - "backend/paid_growth_engine.py"
      - "backend/artist_zero_core.py"
      - "backend/artist_zero_engine.py"
      - "backend/digital_birth_certificate_core.py"
      - "backend/digital_birth_certificate_engine.py"
      - "backend/luzaria_cognition_core.py"
      - "backend/luzaria_cognition_engine.py"
      - "backend/luzaria_model_gateway.py"
      - "backend/luzaria_single_identity_policy.py"
      - "backend/tests/test_artist_growth_core.py"
      - "backend/tests/test_paid_growth_core.py"
      - "backend/tests/test_digital_birth_certificate_core.py"
      - "backend/tests/test_luzaria_cognition_core.py"
      - "backend/tests/test_luzaria_single_identity_policy.py"
      - "docs/ARTIST_GROWTH_ROYALTY_ENGINE.md"
      - "docs/LUZARIA_DIGITAL_BIRTH_CERTIFICATE.md"
      - "docs/LUZARIA_SINGLE_IDENTITY_CANON.md"
      - ".github/workflows/artist-growth-engine-gate.yml"

permissions:
  contents: read

jobs:
  focused-growth-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install focused dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "pytest>=8,<9" "pydantic==2.5.0"

      - name: Compile growth modules
        run: |
          python -m py_compile \
            backend/artist_growth_core.py \
            backend/artist_growth_engine.py \
            backend/paid_growth_core.py \
            backend/paid_growth_connectors.py \
            backend/paid_growth_engine.py \
            backend/artist_zero_core.py \
            backend/artist_zero_engine.py \
            backend/digital_birth_certificate_core.py \
            backend/digital_birth_certificate_engine.py \
            backend/luzaria_cognition_core.py \
            backend/luzaria_model_gateway.py \
            backend/luzaria_single_identity_policy.py \
            backend/luzaria_cognition_engine.py \
            backend/artist_growth_api.py

      - name: Run deterministic business-rule tests
        env:
          PYTHONPATH: backend
        run: |
          pytest -q \
            backend/tests/test_artist_growth_core.py \
            backend/tests/test_paid_growth_core.py \
            backend/tests/test_digital_birth_certificate_core.py \
            backend/tests/test_luzaria_cognition_core.py \
            backend/tests/test_luzaria_single_identity_policy.py
