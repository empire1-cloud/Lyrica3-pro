name: Artist Growth Engine Gate

on:
  push:
    branches:
      - codex/artist-growth-royalty-engine-v1
  pull_request:
    paths:
      - "backend/artist_growth_core.py"
      - "backend/artist_growth_engine.py"
      - "backend/artist_growth_api.py"
      - "backend/tests/test_artist_growth_core.py"
      - "docs/ARTIST_GROWTH_ROYALTY_ENGINE.md"
      - ".github/workflows/artist-growth-engine-gate.yml"

permissions:
  contents: read

jobs:
  focused-growth-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install focused dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "pytest>=8,<9"

      - name: Compile growth modules
        run: |
          python -m py_compile \
            backend/artist_growth_core.py \
            backend/artist_growth_engine.py \
            backend/artist_growth_api.py

      - name: Run deterministic business-rule tests
        env:
          PYTHONPATH: backend
        run: |
          pytest -q backend/tests/test_artist_growth_core.py
