name: Luzaria Identity Gate

on:
  push:
    branches:
      - codex/luzaria-identity-kernel
  pull_request:
    paths:
      - "api/luzaria.py"
      - "api/main.py"
      - "backend/tests/test_luzaria_identity.py"
      - "backend/tests/test_luzaria_release.py"
      - "canon/luzaria/**"
      - "docs/luzaria/**"
      - "frontend/src/pages/Luzaria.tsx"
      - "frontend/src/pages/luzaria.css"
      - "frontend/src/pages/luzaria-release.css"
      - "frontend/src/routes.tsx"
      - ".github/workflows/luzaria-identity-gate.yml"

permissions:
  contents: read

jobs:
  identity-api-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install focused dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            "fastapi==0.104.1" \
            "pydantic==2.5.0" \
            "pytest>=8,<9" \
            "pytest-asyncio>=0.23,<1"

      - name: Compile Luzaria integration
        run: |
          python -m py_compile api/luzaria.py api/main.py

      - name: Run Luzaria identity and release tests
        env:
          PYTHONPATH: .
        run: |
          pytest -q \
            backend/tests/test_luzaria_identity.py \
            backend/tests/test_luzaria_release.py

  public-profile-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm install --legacy-peer-deps --no-audit --no-fund

      - name: Build public profile
        working-directory: frontend
        run: npm run build
