name: Luzaria Identity Gate

on:
  push:
    branches:
      - codex/luzaria-identity-kernel
      - agent/vocal-forge-nahuatl-pronunciation
      - agent/vocal-forge-score-locked-guide
      - agent/vocal-forge-performance-controls
  pull_request:
    paths:
      - "api/luzaria.py"
      - "api/luzaria_assets.py"
      - "api/luzaria_receipts.py"
      - "api/luzaria_voice_math.py"
      - "api/luzaria_voice_performance.py"
      - "api/cultura_pronunciation.py"
      - "api/vocal_forge.py"
      - "api/vocal_expression.py"
      - "api/vocal_performance.py"
      - "api/vocal_forge_app.py"
      - "api/main.py"
      - "backend/tests/test_luzaria_assets.py"
      - "backend/tests/test_luzaria_identity.py"
      - "backend/tests/test_luzaria_release.py"
      - "backend/tests/test_luzaria_receipts.py"
      - "backend/tests/test_luzaria_voice_math.py"
      - "backend/tests/test_cultura_pronunciation.py"
      - "backend/tests/test_vocal_forge.py"
      - "backend/tests/test_vocal_performance.py"
      - "canon/luzaria/**"
      - "canon/cultura/**"
      - "docs/luzaria/**"
      - "docs/CULTURA_VOCAL_FORGE_LANGUAGE_ETHICS.md"
      - "docs/VOCAL_FORGE_SCORE_LOCKED_GUIDE.md"
      - "docs/VOCAL_FORGE_PERFORMANCE_CONTROLS.md"
      - "Dockerfile.vocal-forge"
      - "requirements.vocal-forge.txt"
      - "scripts/render_luzaria_voice_v0.py"
      - "frontend/src/main.tsx"
      - "frontend/src/pages/Luzaria.tsx"
      - "frontend/src/pages/luzaria.css"
      - "frontend/src/pages/luzaria-release.css"
      - "frontend/src/routes.tsx"
      - ".github/workflows/luzaria-identity-gate.yml"

permissions:
  contents: read

jobs:
  identity-api-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install focused dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            "fastapi==0.104.1" \
            "pydantic==2.5.0" \
            "pytest>=8,<9" \
            "pytest-asyncio>=0.23,<1" \
            "numpy>=1.26,<3" \
            "scipy>=1.11,<2"

      - name: Compile Luzaria, Cultura, and Vocal Forge integration
        run: |
          python -m py_compile \
            api/luzaria.py \
            api/luzaria_assets.py \
            api/luzaria_receipts.py \
            api/luzaria_voice_math.py \
            api/luzaria_voice_performance.py \
            api/cultura_pronunciation.py \
            api/vocal_forge.py \
            api/vocal_expression.py \
            api/vocal_performance.py \
            api/vocal_forge_app.py \
            api/main.py \
            scripts/render_luzaria_voice_v0.py

      - name: Run identity, release, receipt, voice, asset, Cultura, and Vocal Forge tests
        env:
          PYTHONPATH: .
        run: |
          pytest -q \
            backend/tests/test_luzaria_assets.py \
            backend/tests/test_luzaria_identity.py \
            backend/tests/test_luzaria_release.py \
            backend/tests/test_luzaria_receipts.py \
            backend/tests/test_luzaria_voice_math.py \
            backend/tests/test_cultura_pronunciation.py \
            backend/tests/test_vocal_forge.py \
            backend/tests/test_vocal_performance.py

      - name: Render mathematical Luzaria Voice v0 artifact
        env:
          PYTHONPATH: .
        run: python scripts/render_luzaria_voice_v0.py

      - name: Upload voice prototype and fingerprint
        uses: actions/upload-artifact@v4
        with:
          name: luzaria-voice-math-v0
          path: artifacts/luzaria_voice_v0/
          if-no-files-found: error
          retention-days: 30

  vocal-forge-service-image:
    needs: identity-api-tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build focused Vocal Forge image
        run: |
          docker build \
            --tag lyrica3-vocal-forge:${{ github.sha }} \
            --file Dockerfile.vocal-forge \
            .

      - name: Boot service and verify routes
        env:
          IMAGE: lyrica3-vocal-forge:${{ github.sha }}
        run: |
          container_id=$(docker run -d \
            -e VOCAL_FORGE_INTERNAL_TOKEN=internal-token-for-ci-1234567890 \
            -e VOCAL_FORGE_RECEIPT_SIGNING_KEY=receipt-signing-key-for-ci-1234567890 \
            -p 18080:8080 \
            "$IMAGE")
          trap 'docker rm -f "$container_id" >/dev/null 2>&1 || true' EXIT

          ready=0
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:18080/healthz > health.json; then
              ready=1
              break
            fi
            sleep 1
          done
          test "$ready" -eq 1
          grep -q 'lyrica3-vocal-forge' health.json

          curl --fail --silent \
            http://127.0.0.1:18080/vocal-forge/performance/styles \
            > performance-styles.json
          grep -q 'Intimate' performance-styles.json
          grep -q 'Gritty' performance-styles.json
          grep -q 'Soaring' performance-styles.json
          grep -q 'Corrido' performance-styles.json

      - name: Verify container command
        run: |
          docker image inspect lyrica3-vocal-forge:${{ github.sha }} \
            --format '{{json .Config.Cmd}}' \
            | tee vocal-forge-entrypoint.txt
          grep -q 'vocal_forge_app:app' vocal-forge-entrypoint.txt

  public-profile-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm install --legacy-peer-deps --no-audit --no-fund

      - name: Build public profile
        working-directory: frontend
        run: npm run build
