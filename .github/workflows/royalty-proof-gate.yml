name: Royalty Proof Gate

on:
  push:
    branches:
      - codex/lyrica-vics-proof-endpoint
      - codex/lyrica-royalty-outbox
  pull_request:
    paths:
      - "api/vics_bridge.py"
      - "api/royalty_outbox.py"
      - "api/royalty_dispatch.py"
      - "api/cultura_pronunciation.py"
      - "api/aether_voice.py"
      - "api/main.py"
      - "backend/production_app.py"
      - "backend/server.py"
      - "backend/requirements.txt"
      - "backend/tests/test_vics_bridge.py"
      - "backend/tests/test_royalty_outbox.py"
      - "backend/tests/test_royalty_dispatch.py"
      - "canon/vocal_forge/**"
      - "canon/cultura/**"
      - "canon/luzaria/voice_model_v0.json"
      - "Dockerfile"
      - ".github/workflows/royalty-proof-gate.yml"

permissions:
  contents: read

jobs:
  focused-proof-and-royalty-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install focused test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            "fastapi==0.104.1" \
            "pydantic==2.5.0" \
            "cryptography>=41,<45" \
            "pytest>=8,<9" \
            "pytest-asyncio>=0.23,<1" \
            "numpy>=1.26,<3" \
            "scipy>=1.11,<2"

      - name: Compile integration modules
        run: |
          python -m py_compile \
            api/vics_bridge.py \
            api/royalty_outbox.py \
            api/royalty_dispatch.py \
            api/cultura_pronunciation.py \
            api/aether_voice.py \
            backend/production_app.py

      - name: Run focused proof and royalty suite
        id: focused_tests
        continue-on-error: true
        env:
          PYTHONPATH: .
        run: |
          set +e
          pytest -vv --tb=short \
            backend/tests/test_vics_bridge.py \
            backend/tests/test_royalty_outbox.py \
            backend/tests/test_royalty_dispatch.py \
            > royalty-proof-test-output.txt 2>&1
          status=$?
          cat royalty-proof-test-output.txt
          echo "exit_code=$status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Upload focused test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: royalty-proof-test-output
          path: royalty-proof-test-output.txt
          if-no-files-found: error
          retention-days: 7

      - name: Enforce focused test result
        if: steps.focused_tests.outputs.exit_code != '0'
        run: |
          echo "Focused proof and royalty tests failed. See royalty-proof-test-output artifact."
          exit 1

  production-backend-image:
    needs: focused-proof-and-royalty-tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build production backend image
        run: |
          docker build \
            --tag lyrica3-royalty-proof:${{ github.sha }} \
            --file Dockerfile \
            .

      - name: Verify production entrypoint and voice routes
        run: |
          image="lyrica3-royalty-proof:${{ github.sha }}"
          docker image inspect "$image" \
            --format '{{json .Config.Cmd}}' \
            | tee docker-entrypoint.txt
          grep -q 'production_app:app' docker-entrypoint.txt
          docker run --rm --entrypoint python "$image" -c "
          from production_app import app
          paths = {getattr(route, 'path', None) for route in app.routes}
          required = {
              '/duo-soul/vocal-forge/engine',
              '/duo-soul/vocal-forge/voice/render',
              '/duo-soul/vocal-forge/tts/render',
          }
          missing = required - paths
          assert not missing, f'missing production routes: {sorted(missing)}'
          print('Aether-Voice production routes verified.')
          "
